name: Bug report
description: Something is broken or crashes
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Tap ...\n3. See error"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DoctorG version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: "Realme 9 Pro, Android 14"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or crash log
      description: Drag and drop screenshots here. Remove any personal data first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first
          required: true
        - label: I removed personal data from screenshots and logs
          required: true
